{{ define "content" }}
<div class="max-w-2xl mx-auto space-y-6">

  <div class="flex flex-wrap items-center justify-between gap-3">
    <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90">{{if .Category.ID}}Edit Category: {{.Category.Name}}{{else}}Create New Product Category{{end}}</h2>
    <a href="/admin/product-categories" class="inline-flex items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 px-4 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800">&larr; Back to Categories</a>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-gray-900">
    <div class="p-5 sm:p-6">
      <form method="POST" action="{{if .Category.ID}}/admin/product-categories/{{.Category.ID}}/edit{{else}}/admin/product-categories/new{{end}}" class="space-y-6">

        <div>
          <label for="name" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Name</label>
          <input type="text" id="name" name="name" required value="{{.Category.Name}}"
            class="h-11 w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent dark:bg-gray-900 px-4 py-2.5 text-sm text-gray-800 dark:text-white/90 placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:outline-none">
        </div>

        <div>
          <label for="slug" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Slug</label>
          <input type="text" id="slug" name="slug" value="{{.Category.Slug}}" placeholder="Auto-generated from name if left blank"
            class="h-11 w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent dark:bg-gray-900 px-4 py-2.5 text-sm text-gray-800 dark:text-white/90 font-mono placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:outline-none">
        </div>

        <div>
          <label for="description" class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Description</label>
          <textarea id="description" name="description" rows="3"
            class="w-full rounded-lg border border-gray-300 dark:border-gray-700 bg-transparent dark:bg-gray-900 px-4 py-2.5 text-sm text-gray-800 dark:text-white/90 placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:outline-none">{{.Category.Description}}</textarea>
        </div>

        <div>
          <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">Image</label>
          <input type="hidden" id="image_id" name="image_id" value="{{if .Category.ImageID}}{{.Category.ImageID}}{{end}}">
          <div id="imagePreview" class="rounded-lg border border-gray-200 dark:border-gray-800 overflow-hidden {{if not .Category.ImageID}}hidden{{end}} mb-3">
            <img id="imagePreviewImg" src="{{.Category.Image.URL}}" alt="" class="w-full h-40 object-cover">
          </div>
          <div id="imageEmpty" class="rounded-lg border-2 border-dashed border-gray-300 dark:border-gray-700 h-32 flex items-center justify-center text-sm text-gray-400 dark:text-gray-500 {{if .Category.ImageID}}hidden{{end}} mb-3">
            No image selected
          </div>
          <div class="flex gap-2">
            <button type="button" id="setImageBtn"
              class="flex-1 inline-flex items-center justify-center rounded-lg border border-gray-300 dark:border-gray-700 px-3 py-2 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800">
              {{if .Category.ImageID}}Change image{{else}}Set image{{end}}
            </button>
            <button type="button" id="removeImageBtn"
              class="inline-flex items-center justify-center rounded-lg border border-gray-300 dark:border-gray-700 px-3 py-2 text-sm font-medium text-red-500 hover:bg-gray-50 dark:hover:bg-gray-800 {{if not .Category.ImageID}}hidden{{end}}">
              Remove
            </button>
          </div>
        </div>

        <div class="flex justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-800">
          <a href="/admin/product-categories" class="inline-flex items-center rounded-lg border border-gray-300 dark:border-gray-700 px-6 py-2.5 text-sm font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-800">Cancel</a>
          <button type="submit" class="inline-flex items-center gap-2 rounded-lg bg-green-600 px-6 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-green-700 transition-colors">
            Save
          </button>
        </div>

      </form>
    </div>
  </div>

</div>

<script>
  function openImagePicker(onSelect) {
    var overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 p-4';
    overlay.innerHTML =
      '<div class="w-full max-w-2xl max-h-[80vh] overflow-y-auto rounded-2xl bg-white dark:bg-gray-900 p-5">' +
        '<div class="flex items-center justify-between mb-4">' +
          '<h3 class="text-base font-medium text-gray-800 dark:text-white/90">Select Image</h3>' +
          '<button type="button" class="text-gray-400 hover:text-gray-700 dark:hover:text-gray-200" id="imagePickerClose">&times;</button>' +
        '</div>' +
        '<div id="imagePickerGrid" class="grid grid-cols-4 gap-3 min-h-[6rem]"><p class="col-span-4 text-sm text-gray-400">Loading...</p></div>' +
      '</div>';
    document.body.appendChild(overlay);

    function close() { overlay.remove(); }
    overlay.addEventListener('click', function (e) { if (e.target === overlay) close(); });
    overlay.querySelector('#imagePickerClose').addEventListener('click', close);

    fetch('/admin/medias/json?type=image')
      .then(function (r) { return r.json(); })
      .then(function (items) {
        var grid = overlay.querySelector('#imagePickerGrid');
        if (!items.length) {
          grid.innerHTML = '<p class="col-span-4 text-sm text-gray-400">No images in the media library yet.</p>';
          return;
        }
        grid.innerHTML = '';
        items.forEach(function (item) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'aspect-square overflow-hidden rounded-lg border border-gray-200 dark:border-gray-800 hover:ring-2 hover:ring-indigo-400';
          btn.innerHTML = '<img src="' + item.url + '" alt="" class="h-full w-full object-cover">';
          btn.addEventListener('click', function () { onSelect(item); close(); });
          grid.appendChild(btn);
        });
      })
      .catch(function () {
        overlay.querySelector('#imagePickerGrid').innerHTML = '<p class="col-span-4 text-sm text-red-500">Failed to load images.</p>';
      });
  }

  document.getElementById('setImageBtn').addEventListener('click', function () {
    openImagePicker(function (item) {
      document.getElementById('image_id').value = item.id;
      document.getElementById('imagePreviewImg').src = item.url;
      document.getElementById('imagePreview').classList.remove('hidden');
      document.getElementById('imageEmpty').classList.add('hidden');
      document.getElementById('setImageBtn').textContent = 'Change image';
      document.getElementById('removeImageBtn').classList.remove('hidden');
    });
  });

  document.getElementById('removeImageBtn').addEventListener('click', function () {
    document.getElementById('image_id').value = '';
    document.getElementById('imagePreview').classList.add('hidden');
    document.getElementById('imageEmpty').classList.remove('hidden');
    document.getElementById('setImageBtn').textContent = 'Set image';
    document.getElementById('removeImageBtn').classList.add('hidden');
  });
</script>
{{ end }}
