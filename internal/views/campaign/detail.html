{{ define "content" }}
<div x-data="campaignDetailPage()" x-init="load()" class="space-y-6">

  <div class="flex items-center justify-between gap-3">
    <div>
      <h1 class="text-xl font-semibold text-gray-900" x-text="order.campaign_name || 'Campaign detail'"></h1>
      <p class="text-sm text-gray-500" x-text="order.order_id"></p>
    </div>
    <div class="flex items-center gap-2">
      <span class="px-2.5 py-1 rounded-full text-xs font-medium" :class="statusColor(order.status)" x-text="statusLabels[order.status]"></span>
      <a href="{{ .BasePath }}/edit/{{ .OrderID }}{{ if .Embedded }}?key={{ .CampaignKey }}{{ end }}"
        class="h-9 px-4 inline-flex items-center rounded-lg border border-gray-300 text-sm font-medium text-gray-700 hover:bg-gray-50">Edit</a>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-5 sm:p-6 space-y-3">
    <h2 class="font-medium text-gray-900">Campaign Info</h2>
    <p class="text-sm text-gray-600" x-text="order.campaign_description"></p>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4 text-sm">
      <div><div class="text-gray-400">Schedule Start</div><div class="text-gray-800" x-text="fmtDate(order.schedule_start)"></div></div>
      <div><div class="text-gray-400">Schedule End</div><div class="text-gray-800" x-text="fmtDate(order.schedule_end)"></div></div>
      <div><div class="text-gray-400">Qty</div><div class="text-gray-800" x-text="order.qty"></div></div>
      <div><div class="text-gray-400">Grand Total</div><div class="text-gray-800 font-semibold" x-text="formatRupiah(order.grand_total)"></div></div>
    </div>
  </div>

  <div class="rounded-2xl border border-gray-200 bg-white p-5 sm:p-6 space-y-3">
    <h2 class="font-medium text-gray-900">Targeting &amp; Creative</h2>
    <div class="divide-y divide-gray-100">
      <template x-for="(d, idx) in details" :key="idx">
        <div class="py-3 grid grid-cols-1 sm:grid-cols-3 gap-2 text-sm">
          <div><div class="text-gray-400">Audience</div><div class="text-gray-800" x-text="d.audienceName || '-'"></div></div>
          <div><div class="text-gray-400">Creative</div><div class="text-gray-800" x-text="d.creativeName || '-'"></div></div>
          <div><div class="text-gray-400">Qty</div><div class="text-gray-800" x-text="d.qty"></div></div>
        </div>
      </template>
    </div>
  </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('campaignDetailPage', () => ({
    order: {},
    details: [],
    statusLabels: {
      0: 'Draft', 1: 'Menunggu Moderasi', 2: 'Dalam Moderasi', 3: 'Menunggu Tayang',
      4: 'Ditolak', 5: 'Sedang Tayang', 6: 'Sudah Tayang', 7: 'Lanjut Pembayaran', 8: 'Lakukan Pembayaran',
    },
    statusColor(status) {
      const map = { 0: 'bg-gray-100 text-gray-600', 4: 'bg-red-100 text-red-600', 5: 'bg-green-100 text-green-600', 6: 'bg-blue-100 text-blue-600' };
      return map[status] || 'bg-amber-100 text-amber-700';
    },
    fmtDate(v) { return v ? new Date(v).toLocaleDateString('id-ID') : '-'; },
    load() {
      campaignApi(`/campaign/api/orders/{{ .OrderID }}`).then(async (o) => {
        this.order = o;
        this.details = await Promise.all((o.details || []).map(async (d) => {
          const row = Object.assign({}, d);
          if (d.audience_id) row.audienceName = await campaignApi(`/campaign/api/audiences/${d.audience_id}`).then(a => a.name).catch(() => d.audience_id);
          if (d.creative_id) row.creativeName = await campaignApi(`/campaign/api/creatives/${d.creative_id}`).then(cr => cr.name).catch(() => d.creative_id);
          return row;
        }));
      });
    },
  }));
});
</script>
{{ end }}
