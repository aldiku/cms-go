{{ define "content" }}
<div x-data="campaignListPage()" x-init="load()" class="space-y-6">

  <div class="flex flex-wrap items-center justify-between gap-3">
    <h1 class="text-xl font-semibold text-gray-900">Campaign</h1>
    <a href="{{ .BasePath }}/add{{ if .Embedded }}?key={{ .CampaignKey }}{{ end }}"
      class="inline-flex items-center gap-2 rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:bg-indigo-700">
      <i class="fa-solid fa-plus"></i> Add Campaign
    </a>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
    <template x-for="stat in stats" :key="stat.label">
      <div class="rounded-2xl border border-gray-200 bg-white p-4">
        <div class="text-sm text-gray-500" x-text="stat.label"></div>
        <div class="text-2xl font-semibold text-gray-900" x-text="stat.value"></div>
      </div>
    </template>
  </div>

  <!-- Filter -->
  <div class="flex flex-wrap items-center gap-3">
    <select x-model="statusFilter" @change="page = 1; load()"
      class="h-11 rounded-lg border border-gray-300 px-4 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:outline-none">
      <option value="">All statuses</option>
      <template x-for="(label, code) in statusLabels" :key="code">
        <option :value="code" x-text="label"></option>
      </template>
    </select>
    <input type="text" x-model="search" @input.debounce.400ms="page = 1; load()" placeholder="Search campaign..."
      class="h-11 flex-1 min-w-[16rem] rounded-lg border border-gray-300 px-4 text-sm focus:border-indigo-400 focus:ring-2 focus:ring-indigo-100 focus:outline-none">
  </div>

  <!-- Cards -->
  <div x-show="!loading && orders.length === 0" class="text-center text-gray-500 py-16 rounded-2xl border border-dashed border-gray-300">
    No campaigns yet.
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
    <template x-for="order in orders" :key="order.order_id">
      <a :href="`{{ .BasePath }}/detail/${order.order_id}{{ if .Embedded }}?key={{ .CampaignKey }}{{ end }}`"
        class="block rounded-2xl border border-gray-200 bg-white p-5 hover:shadow-md transition-shadow">
        <div class="flex items-start justify-between gap-2">
          <h3 class="font-medium text-gray-900" x-text="order.campaign_name || '(untitled campaign)'"></h3>
          <span class="shrink-0 px-2 py-0.5 rounded-full text-xs font-medium"
            :class="statusColor(order.status)" x-text="statusLabels[order.status]"></span>
        </div>
        <p class="mt-1 text-sm text-gray-500 line-clamp-2" x-text="order.campaign_description"></p>
        <div class="mt-4 flex items-center justify-between text-sm">
          <span class="text-gray-500" x-text="'Qty: ' + (order.qty || 0)"></span>
          <span class="font-semibold text-gray-900" x-text="formatRupiah(order.grand_total)"></span>
        </div>
      </a>
    </template>
  </div>

  <!-- Pagination -->
  <div class="flex items-center justify-center gap-3" x-show="totalPages > 1">
    <button @click="page = Math.max(1, page - 1); load()" :disabled="page <= 1"
      class="h-9 px-3 rounded-lg border border-gray-300 text-sm disabled:opacity-40">Prev</button>
    <span class="text-sm text-gray-600" x-text="`Page ${page} / ${totalPages}`"></span>
    <button @click="page = Math.min(totalPages, page + 1); load()" :disabled="page >= totalPages"
      class="h-9 px-3 rounded-lg border border-gray-300 text-sm disabled:opacity-40">Next</button>
  </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
  Alpine.data('campaignListPage', () => ({
    orders: [],
    loading: false,
    page: 1,
    perPage: 20,
    total: 0,
    search: '',
    statusFilter: '',
    statusLabels: {
      0: 'Draft', 1: 'Menunggu Moderasi', 2: 'Dalam Moderasi', 3: 'Menunggu Tayang',
      4: 'Ditolak', 5: 'Sedang Tayang', 6: 'Sudah Tayang', 7: 'Lanjut Pembayaran', 8: 'Lakukan Pembayaran',
    },
    get totalPages() { return Math.max(1, Math.ceil(this.total / this.perPage)); },
    get stats() {
      return [
        { label: 'Total Campaign', value: this.total },
        { label: 'Draft', value: this.orders.filter(o => o.status === 0).length },
        { label: 'Sedang Tayang', value: this.orders.filter(o => o.status === 5).length },
        { label: 'Sudah Tayang', value: this.orders.filter(o => o.status === 6).length },
      ];
    },
    statusColor(status) {
      const map = { 0: 'bg-gray-100 text-gray-600', 4: 'bg-red-100 text-red-600', 5: 'bg-green-100 text-green-600', 6: 'bg-blue-100 text-blue-600' };
      return map[status] || 'bg-amber-100 text-amber-700';
    },
    load() {
      this.loading = true;
      const params = new URLSearchParams({ page: this.page });
      if (this.statusFilter !== '') params.set('status', this.statusFilter);
      campaignApi('/campaign/api/orders?' + params.toString())
        .then(res => {
          let data = res.data || [];
          if (this.search) {
            const q = this.search.toLowerCase();
            data = data.filter(o => (o.campaign_name || '').toLowerCase().includes(q));
          }
          this.orders = data;
          this.total = res.total || 0;
        })
        .catch(err => console.error(err))
        .finally(() => this.loading = false);
    },
  }));
});
</script>
{{ end }}
