<button id="theme-toggle" type="button" aria-label="Toggle theme"
  class="fixed top-4 right-4 z-50 inline-flex items-center justify-center w-10 h-10 rounded-full border border-gray-200 bg-white text-gray-600 shadow-sm hover:bg-gray-50 transition dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700">
  <svg id="icon-sun" class="w-5 h-5 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.364 6.364-1.06-1.06M6.696 6.696 5.636 5.636m12.728 0-1.06 1.06M6.696 17.304l-1.06 1.06M12 7.5a4.5 4.5 0 100 9 4.5 4.5 0 000-9Z"/></svg>
  <svg id="icon-moon" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 008.997-5.998Z"/></svg>
</button>

<div class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900 px-4 py-8 transition-colors duration-300">

  <div id="auth-card" class="w-full max-w-4xl bg-white dark:bg-gray-800 rounded-2xl shadow-lg overflow-hidden flex flex-col md:flex-row transition-all duration-300">

    <div class="hidden md:block md:w-1/2 bg-gray-100 dark:bg-gray-900">
      <img src="https://picsum.photos/seed/auth-login/600/800" alt="" class="w-full h-full object-cover">
    </div>

    <div class="w-full md:w-1/2 p-8 flex flex-col justify-center">

      <h1 class="text-2xl font-bold text-gray-900 dark:text-white text-center">
        Login untuk mengakses dashboard.
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 text-center mt-1">
        Masukkan email dan password anda yang terdaftar
      </p>

      <div id="form-alert" class="hidden mt-5 rounded-lg px-4 py-3 text-sm"></div>

      <form id="login-form" class="mt-6 space-y-5" novalidate>

        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Email
          </label>
          <input
            id="email"
            type="email"
            required
            autocomplete="email"
            placeholder="user@domain.com"
            class="mt-1 w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:outline-none transition text-sm"
          />
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
            Password
          </label>
          <input
            id="password"
            type="password"
            required
            autocomplete="current-password"
            placeholder="********"
            class="mt-1 w-full px-4 py-2.5 border border-gray-300 dark:border-gray-600 rounded-lg bg-white dark:bg-gray-900 text-gray-900 dark:text-gray-100 placeholder-gray-400 dark:placeholder-gray-500 focus:ring-2 focus:ring-blue-500 focus:outline-none transition text-sm"
          />
        </div>

        <div class="flex items-center justify-between pt-1">
          <a href="/forgot-password" class="text-sm text-blue-600 dark:text-blue-400 hover:underline font-medium">
            Reset Password?
          </a>
          <button
            id="login-submit"
            type="submit"
            class="px-8 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg transition shadow-sm"
          >
            Login
          </button>
        </div>
      </form>

      <p class="text-sm text-gray-600 dark:text-gray-400 text-center mt-6">
        Belum punya akun?
        <a href="/register" class="text-blue-600 dark:text-blue-400 hover:underline font-medium">
          Buat akun baru
        </a>
      </p>

    </div>
  </div>
</div>

<script src="/assets/auth/auth-api.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var alertEl = document.getElementById("form-alert");
    var button = document.getElementById("login-submit");
    AuthAPI.hideAlert(alertEl);
    AuthAPI.setLoading(button, true, "Signing in…");

    try {
      var csrf_token = await AuthAPI.getCsrfToken();
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;

      var result = await AuthAPI.postJSON("/auth/login", { email: email, password: password, csrf_token: csrf_token });
      if (!result.ok) {
        AuthAPI.showAlert(alertEl, result.data.error || "Login failed. Please try again.", "error");
        AuthAPI.setLoading(button, false);
        return;
      }

      AuthAPI.showAlert(alertEl, "Login successful — redirecting…", "success");
      AuthAPI.smoothRedirect("/dashboard");
    } catch (err) {
      AuthAPI.showAlert(alertEl, "Network error. Please try again.", "error");
      AuthAPI.setLoading(button, false);
    }
  });
</script>
